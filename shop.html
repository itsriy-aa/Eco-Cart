<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCart | Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="container header-content">
        <div class="logo">EcoCart 🌿</div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="impact.html">Our Impact</a></li>
                <li><a href="blog.html">Eco-Blog</a></li>
            </ul>
        </nav>

        <div class="cart-icon">Cart (0)</div>
    </div>
</header>

<section class="products">
    <div class="container">
        <h2>All Eco-Friendly Products</h2>
        <p>Browse all our sustainable items that help reduce environmental harm.</p>

        <div class="product-grid">

            <div class="product-card">
                <div class="product-image"><img src="photos/bamboobottle.jpg"></div>
                <div class="product-info">
                    <h3>Bamboo Water Bottle</h3>
                    <p class="price">$24.99</p>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image"><img src="photos/bag.webp"></div>
                <div class="product-info">
                    <h3>Canvas Tote Bag</h3>
                    <p class="price">$15.00</p>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image"><img src="photos/notebook.jpg"></div>
                <div class="product-info">
                    <h3>Recycled Paper Notebook</h3>
                    <p class="price">$12.50</p>
                </div>
            </div>

        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2025 EcoCart. Built for a greener future.</p>
    </div>
</footer>

</body>
</html>
